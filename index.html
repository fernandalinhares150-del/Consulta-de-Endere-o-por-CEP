<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de endereço por CEP</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <!-- Título principal da página -->
    <h1>Consulta de endereço por CEP</h1>

    <!-- Formulário para realizar a consulta -->
    <form id="formConsulta">

        <!-- Nome do campo de CEP -->
        <label for="cep">CEP</label>

        <!-- Campo para digitar o CEP -->
        <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="01001-000" required>

        <!-- Nome do campo de cidade -->
        <label for="cidade">Cidade</label>

        <!-- Campo para digitar a cidade -->
        <input id="cidade" type="text" placeholder="São Paulo" required>

        <!-- Botão para enviar a consulta -->
        <button type="submit">
            🔍 Consultar Endereço
        </button>

    </form>

    <!-- Área onde as mensagens de erro serão mostradas -->
    <p id="mensagem" role="status" aria-live="polite"></p>

    <!-- Liga o arquivo JavaScript -->
    <script src="index.js"></script>

</body>

</html>
