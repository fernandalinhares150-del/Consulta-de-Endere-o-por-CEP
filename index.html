```html
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de endereço por CEP</title>

    <!-- Liga o CSS à página -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Título principal -->
    <h1>Consulta de endereço por CEP</h1>

    <!-- Formulário para realizar a consulta -->
    <form id="formConsulta">

        <!-- Campo do CEP -->
        <label for="cep">CEP</label>

        <input
            id="cep"
            type="text"
            inputmode="numeric"
            maxlength="9"
            placeholder="01001-000"
            required
        >

        <!-- Campo da cidade -->
        <label for="cidade">Cidade</label>

        <input
            id="cidade"
            type="text"
            placeholder="São Paulo"
            required
        >

        <!-- Botão de consulta -->
        <button type="submit">
            🔍 Consultar Endereço
        </button>

    </form>

    <!-- Área para mostrar mensagens -->
    <p id="mensagem" role="status" aria-live="polite"></p>

    <!-- Liga o JavaScript -->
    <script src="index.js"></script>

</body>

</html>
```
